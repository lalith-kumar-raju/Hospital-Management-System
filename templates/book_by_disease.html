{% extends 'base.html' %}
{% block title %}Book by Disease - HealthCare HMS{% endblock %}

{% block content %}
<div class="container py-4">
    <h2><i class="bi bi-heart-pulse"></i> Book by Disease</h2>
    <p class="text-muted">Select your condition and we'll assign the right specialist for you.</p>
    <hr>
    <div class="row">
        <div class="col-md-8">
            <form id="bookDiseaseForm" method="POST" action="{{ url_for('book_by_disease') }}">
                <div class="mb-3">
                    <label for="disease" class="form-label">Select Disease / Condition</label>
                    <select class="form-select" id="disease" name="disease" required>
                        <option value="">-- Choose Condition --</option>
                        {% for d in diseases %}
                        <option value="{{ d }}">{{ d }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="appointment_date" class="form-label">Preferred Date</label>
                    <input type="date" class="form-control" id="appointment_date" name="appointment_date" required>
                </div>
                <div class="mb-3">
                    <label for="time_slot" class="form-label">Preferred Time Slot</label>
                    <select class="form-select" id="time_slot" name="time_slot" required>
                        <option value="">-- Select Time --</option>
                        {% for slot in time_slots %}
                        <option value="{{ slot }}">{{ slot }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="symptoms" class="form-label">Symptoms / Notes (optional)</label>
                    <textarea class="form-control" id="symptoms" name="symptoms" rows="3" placeholder="Describe your symptoms..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Book Appointment</button>
                <a href="{{ url_for('book_appointment') }}" class="btn btn-outline-secondary ms-2">Book by Doctor Instead</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    var today = new Date().toISOString().split('T')[0];
    $('#appointment_date').attr('min', today);
});
</script>
{% endblock %}
